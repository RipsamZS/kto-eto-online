<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#100d20">
<title>Кто я? — игровые комнаты</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px 16px;background:radial-gradient(circle at 20% 15%,#38235f,transparent 42%),#100d20;color:#f6f2ff;font-family:Arial,sans-serif}
.page{width:min(900px,100%);margin:0 auto;padding-top:54px}.top{display:flex;align-items:center;justify-content:flex-start;gap:12px}.top a{position:fixed;top:16px;left:16px;z-index:110;padding:9px 13px;border:1px solid #a78bfa;border-radius:11px;background:#211a38;color:#e4d8ff;text-decoration:none;box-shadow:0 4px 18px #0005}.corner-title{position:fixed;top:12px;right:22px;z-index:110;color:#f6f2ff;font-size:clamp(20px,3vw,28px);font-weight:800;letter-spacing:.4px;text-align:center;display:flex;flex-direction:column-reverse;align-items:center;gap:2px}.corner-title .emoji{font-size:30px;line-height:1}.hero{text-align:center;padding:12px 10px 0}.hero p{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:105;width:min(58vw,680px);margin:0;color:#e4d8ff;line-height:1.5;text-align:center}
.notice{max-width:760px;margin:16px auto;padding:14px 17px;border:1px solid #a78bfa55;border-radius:14px;background:#7c3aed18;color:#e4d8ff;line-height:1.5}

@import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap");
:root{color-scheme:light;--bg:#f3f0e9;--panel:#fffdf8;--panel2:#eee9df;--accent:#6546a5;--accent2:#513487;--text:#252231;--muted:#777181;--line:#ded8ce;--lime:#d7f36a;--border:#ded8ce}
body{background-color:#f3f0e9!important;background-image:radial-gradient(#d8d0c4 .7px,transparent .7px)!important;background-size:18px 18px!important;color:#252231!important;font-family:"DM Sans",Inter,system-ui,sans-serif!important}
.panel,.card,.room-card,.game-panel,.modal,.notice{background:#fffdf8!important;color:#252231!important;border:1px solid #ded8ce!important;border-radius:18px!important;box-shadow:0 8px 24px #30251a0a!important}
h1,h2,h3,.hero h1{font-family:"Space Grotesk","DM Sans",sans-serif!important;color:#252231!important}
p,.muted,.description{color:#777181}
button,.btn{border-radius:999px!important}
button.primary,.primary,.btn-primary{background:#6546a5!important;color:white!important}
button.secondary,.secondary,.btn-secondary{background:#eee8f6!important;color:#6546a5!important;border:1px solid #ded3ef!important}
input,textarea,select{background:#fffefa!important;color:#252231!important;border:1px solid #ded8ce!important;border-radius:12px!important}
a{color:#6546a5}
.top a{background:#fffdf8!important;color:#6546a5!important;border:1px solid #ded8ce!important;box-shadow:none!important}

/* Signature art direction — Who am I? */
body[data-game="who-am-i"]{background:radial-gradient(circle at 12% 8%,#f8cbdc 0,transparent 34%),radial-gradient(circle at 88% 82%,#d9c9f0 0,transparent 36%),#f7e7ed!important;color:#422c3a!important}
body[data-game="who-am-i"] .corner-title{top:20px;right:28px;color:#6f3e59!important;font:800 15px "Space Grotesk",sans-serif;letter-spacing:.14em;text-transform:uppercase}
body[data-game="who-am-i"] .corner-title .emoji{display:grid;place-items:center;width:42px;height:42px;margin-bottom:5px;border:1px solid #e8c2d2;border-radius:14px;background:#fff8fb;font-size:23px}
body[data-game="who-am-i"] .top a{border:1px solid #e8cbd8!important;border-radius:12px!important;background:#fffafd!important;color:#874a68!important;box-shadow:0 4px 0 #e8cbd8!important;font-weight:800}
body[data-game="who-am-i"] .hero{padding:20px 10px 24px!important}
body[data-game="who-am-i"] .hero p{position:static!important;transform:none!important;width:min(680px,100%)!important;margin:0 auto!important;color:#8a6b7b!important;font-size:14px!important}
body[data-game="who-am-i"] .srs{max-width:1080px!important;padding:0!important;background:transparent!important;color:#422c3a!important}
body[data-game="who-am-i"] .srs-mode-menu,body[data-game="who-am-i"] #srsHome{border:1px solid #e8cbd8!important;border-radius:25px!important;background:linear-gradient(145deg,#fffafd,#f8eaf0)!important;box-shadow:0 22px 60px #9b607b1a!important}
body[data-game="who-am-i"] .srs-setup-card,body[data-game="who-am-i"] .srs-card{border:1px solid #e8cbd8!important;border-radius:20px!important;background:#fffafd!important;box-shadow:0 9px 26px #9b607b12!important;color:#422c3a!important}
body[data-game="who-am-i"] .srs h2,body[data-game="who-am-i"] .srs h3{color:#633d55!important;font-family:"Space Grotesk",sans-serif!important}
body[data-game="who-am-i"] .srs p,body[data-game="who-am-i"] .srs .muted,body[data-game="who-am-i"] .srs label{color:#8a6b7b!important}
body[data-game="who-am-i"] .srs button{border-radius:13px!important;background:linear-gradient(145deg,#bd6f91,#874a68)!important;color:#fff!important;box-shadow:0 4px 0 #713c56!important}
body[data-game="who-am-i"] .srs button.alt{background:#f8eaf0!important;color:#874a68!important;border:1px solid #e8cbd8!important;box-shadow:none!important}
body[data-game="who-am-i"] .srs input,body[data-game="who-am-i"] .srs select{border:1px solid #e8cbd8!important;border-radius:12px!important;background:#fff!important;color:#422c3a!important}
body[data-game="who-am-i"] .srs .status{border:1px solid #e8cbd8!important;border-radius:14px!important;background:#f8eaf0!important;color:#633d55!important}
body[data-game="who-am-i"] .srs .srs-table-wrap{border:1px solid #e8cbd8!important;border-radius:28px!important;background:radial-gradient(circle at 50% 50%,#fff8fb,#f4dce7)!important;box-shadow:inset 0 0 60px #bd6f9118,0 18px 48px #874a681c!important}
body[data-game="who-am-i"] .srs .srs-seat{border:2px solid #e2b8cb!important;border-radius:20px!important;background:linear-gradient(145deg,#fffafd,#f8eaf0)!important;color:#633d55!important;box-shadow:0 7px 0 #e8cbd8!important}
body[data-game="who-am-i"] .srs .srs-seat.mine{outline:3px solid #bd6f91!important;outline-offset:4px!important}
@media(max-width:620px){body[data-game="who-am-i"] .corner-title{position:absolute;top:14px;right:12px;font-size:11px}body[data-game="who-am-i"] .page{padding-top:50px}}
</style>
</head>
