<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#100d20">
<title>Кто я? — игровые комнаты</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px 16px;background:radial-gradient(circle at 20% 15%,#38235f,transparent 42%),#100d20;color:#f6f2ff;font-family:Arial,sans-serif}
.page{width:min(900px,100%);margin:0 auto;padding-top:54px}.top{display:flex;align-items:center;justify-content:flex-start;gap:12px}.top a{position:fixed;top:16px;left:16px;z-index:110;padding:9px 13px;border:1px solid #a78bfa;border-radius:11px;background:#211a38;color:#e4d8ff;text-decoration:none;box-shadow:0 4px 18px #0005}.corner-title{position:fixed;top:12px;right:22px;z-index:110;color:#f6f2ff;font-size:clamp(20px,3vw,28px);font-weight:800;letter-spacing:.4px;text-align:center;display:flex;flex-direction:column-reverse;align-items:center;gap:2px}.corner-title .emoji{font-size:30px;line-height:1}.hero{text-align:center;padding:12px 10px 0}.hero p{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:105;width:min(58vw,680px);margin:0;color:#e4d8ff;line-height:1.5;text-align:center}
.notice{max-width:760px;margin:16px auto;padding:14px 17px;border:1px solid #a78bfa55;border-radius:14px;background:#7c3aed18;color:#e4d8ff;line-height:1.5}
</style>
</head>
<body>
<main class="page">
  <div class="corner-title"><span>Кто я?</span><span class="emoji">🎭</span></div>
  <div class="top"><a href="/">← На главную</a></div>
  <header class="hero"><p>Каждый придумывает слово для следующего игрока по кругу, а своё слово узнаёт только после раздачи.</p></header>

  <div id="sharedRoomSystem"></div>
</main>
<script src="/online-client.js"></script>
<script>window.ROOM_GAME_ID="who-am-i";</script>
<script src="/games/who-am-i/room.js"></script>
</body>
</html>
