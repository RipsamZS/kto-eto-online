<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a1019">
<title>Морской бой — KAZO</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#0a1019;color:#e8eef7}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:22px;background:radial-gradient(ellipse at 50% -15%,#1b3b4b 0,transparent 55%),linear-gradient(180deg,#0a1019,#101a28)}
.page{width:min(920px,100%);margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px}
.top a{color:#b9d7e5;text-decoration:none;border:1px solid #344c5d;border-radius:8px;padding:9px 13px;background:#142332}
.brand{font-size:12px;font-weight:900;letter-spacing:.18em;color:#80c5d4}
header{text-align:center;margin:12px 0 28px}
.kicker{font-size:11px;letter-spacing:.2em;color:#7fa8b8;font-weight:800}
h1{font-size:clamp(26px,5vw,42px);margin:9px 0;color:#f0f6fb}
.subtitle{color:#91a8b8;margin:0}
.board-panel{padding:clamp(12px,3vw,24px);border:1px solid #2b4354;border-radius:16px;background:linear-gradient(145deg,#142535,#0f1b29);box-shadow:0 22px 60px #0005}
.board-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;color:#c5d8e4;font-size:12px;letter-spacing:.1em;font-weight:800}
.board-heading span:last-child{color:#70bdce}
.board{display:grid;grid-template-columns:34px repeat(10,minmax(0,1fr));gap:5px;width:100%;max-width:760px;margin:0 auto}
.axis{display:grid;place-items:center;min-width:0;aspect-ratio:1;color:#8ba8b9;font-size:clamp(10px,1.8vw,14px);font-weight:800}
.cell{display:block;min-width:0;aspect-ratio:1;padding:0;border:1px solid #35556b;border-radius:4px;background:linear-gradient(145deg,#18364a,#122a3b);box-shadow:inset 0 1px #ffffff0a;cursor:default}
.cell:hover{border-color:#5ca9bd;background:#1d4054}
.board-note{text-align:center;color:#718b9c;font-size:12px;margin:16px 0 0}
@media(max-width:520px){body{padding:14px 9px}.top{margin-bottom:25px}.board{gap:3px;grid-template-columns:24px repeat(10,minmax(0,1fr))}.cell{border-radius:2px}.board-panel{padding:10px}.board-heading{font-size:10px}}
</style>
</head>
